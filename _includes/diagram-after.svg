<figure class="dgm">
<svg class="dgm-svg" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The new pipeline: the upload is streamed into small chunks, each chunk becomes one queue message, and any worker on any pod can process any chunk.">
<style>
  .dgm-svg text{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .dgm-eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;fill:var(--muted,#68707C)}
  .dgm-cap{font-size:14.5px;font-weight:700;fill:var(--ink,#1B1E24)}
  .dgm-lbl{font-size:14px;font-weight:600;fill:var(--ink,#1B1E24)}
  .dgm-chk{font-size:12.5px;fill:var(--ink,#1B1E24)}
  .dgm-sub{font-size:12.5px;fill:var(--muted,#68707C)}
  .dgm-flow{font-size:11.5px;font-weight:600;fill:var(--muted,#68707C)}
  .dgm-hot{font-size:12.5px;font-weight:600;fill:var(--hot,#B23C28)}
  .dgm-cool{font-size:12.5px;font-weight:600;fill:var(--accent,#146A68)}
  .dgm-box{fill:none;stroke:var(--rule,#CFCCC4);stroke-width:1.5}
  .dgm-box-hot{fill:var(--hotfill,#F7EAE6);stroke:var(--hotrule,#DDA492);stroke-width:1.5}
  .dgm-chunk{fill:var(--coolfill,#E4F1F0);stroke:var(--coolrule,#8CC3BF);stroke-width:1.4}
  .dgm-worker{fill:none;stroke:var(--coolrule,#8CC3BF);stroke-width:1.5}
  .dgm-ln{stroke:var(--muted,#68707C);stroke-width:1.5;fill:none}
  .dgm-ln-hot{stroke:var(--hot,#B23C28);stroke-width:2;fill:none}
  .dgm-ln-cool{stroke:var(--coolrule,#8CC3BF);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dgm-head{fill:var(--muted,#68707C)}
  .dgm-head-hot{fill:var(--hot,#B23C28)}
  .dgm-head-cool{fill:var(--coolrule,#8CC3BF)}
  .dgm-axis{stroke:var(--rule,#CFCCC4);stroke-width:1.3}
  .dgm-limit{stroke:var(--muted,#68707C);stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
  .dgm-line-hot{stroke:var(--hot,#B23C28);stroke-width:2.5;fill:none;stroke-linejoin:round}
  .dgm-area-hot{fill:var(--hot,#B23C28);opacity:var(--dgm-fill,.16)}
  .dgm-line-cool{stroke:var(--accent,#146A68);stroke-width:2.5;fill:none;stroke-linejoin:round}
  .dgm-area-cool{fill:var(--accent,#146A68);opacity:var(--dgm-fill,.16)}
  .dgm-x{stroke:var(--hot,#B23C28);stroke-width:3;stroke-linecap:round}
</style>
<defs>
  <marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dgm-head"/></marker>
  <marker id="aHh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dgm-head-hot"/></marker>
  <marker id="aHc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="dgm-head-cool"/></marker>
</defs>
<text x="2" y="14" class="dgm-eyebrow">AFTER — NOTHING HOLDS THE WHOLE FILE</text>

<rect x="2" y="56" width="110" height="58" rx="10" class="dgm-box"/>
<text x="57" y="81" class="dgm-lbl" text-anchor="middle">Client</text>
<text x="57" y="100" class="dgm-sub" text-anchor="middle">uploads 1 GB</text>

<path d="M118 85 H170" class="dgm-ln" marker-end="url(#aH)"/>
<text x="144" y="72" class="dgm-flow" text-anchor="middle">streamed</text>

<rect x="178" y="42" width="164" height="28" rx="6" class="dgm-chunk"/>
<text x="260" y="61" class="dgm-chk" text-anchor="middle">chunk 0 · 1,000 rows</text>
<rect x="178" y="76" width="164" height="28" rx="6" class="dgm-chunk"/>
<text x="260" y="95" class="dgm-chk" text-anchor="middle">chunk 1 · 1,000 rows</text>
<rect x="178" y="110" width="164" height="28" rx="6" class="dgm-chunk"/>
<text x="260" y="129" class="dgm-chk" text-anchor="middle">chunk 2 · 1,000 rows</text>

<path d="M350 90 H404" class="dgm-ln-cool" marker-end="url(#aHc)"/>
<text x="524" y="84" class="dgm-cool" text-anchor="middle">one queue message</text>
<text x="524" y="102" class="dgm-cool" text-anchor="middle">per chunk</text>

<path d="M260 146 V196 M92 196 H548 M92 196 V214 M320 196 V214 M548 196 V214" class="dgm-ln-cool"/>
<path d="M92 206 V220" class="dgm-ln-cool" marker-end="url(#aHc)"/>
<path d="M320 206 V220" class="dgm-ln-cool" marker-end="url(#aHc)"/>
<path d="M548 206 V220" class="dgm-ln-cool" marker-end="url(#aHc)"/>

<rect x="36" y="228" width="112" height="58" rx="10" class="dgm-worker"/>
<text x="92" y="253" class="dgm-lbl" text-anchor="middle">worker</text>
<text x="92" y="272" class="dgm-sub" text-anchor="middle">chunk 0</text>

<rect x="264" y="228" width="112" height="58" rx="10" class="dgm-worker"/>
<text x="320" y="253" class="dgm-lbl" text-anchor="middle">worker</text>
<text x="320" y="272" class="dgm-sub" text-anchor="middle">chunk 1</text>

<rect x="492" y="228" width="112" height="58" rx="10" class="dgm-worker"/>
<text x="548" y="253" class="dgm-lbl" text-anchor="middle">worker</text>
<text x="548" y="272" class="dgm-sub" text-anchor="middle">chunk 2</text>

<text x="320" y="316" class="dgm-cool" text-anchor="middle">any pod · any chunk · bounded memory · retry = one chunk</text>
</svg></figure>
